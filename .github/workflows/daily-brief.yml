name: Daily Market Brief

on:
  schedule:
    # 08:00 KST Monday-Friday = 23:00 UTC Sunday-Thursday.
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Market data date for manual testing/backfill (YYYY-MM-DD). Leave blank for the normal daily run."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Generate market brief
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/generate_daily_brief.py --target-date "$TARGET_DATE"
          else
            python scripts/generate_daily_brief.py
          fi

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "전일 시장 요약 HTML 보관"
            git push
          fi
