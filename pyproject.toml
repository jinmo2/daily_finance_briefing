[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "daily-market-brief"
version = "0.1.0"
description = "Generate a daily previous-market-summary HTML report with FinanceDataReader."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "finance-datareader>=0.9.102",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/market_brief"]
